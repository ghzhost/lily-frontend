name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Write workflow summary
        if: always()
        run: |
          {
            echo "## Dependency audit"
            echo ""
            echo "- Command: \`npm audit --omit=dev --audit-level=high\`"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      NEXT_PUBLIC_SITE_URL: https://lilyprotocol.dev
      NEXT_PUBLIC_API_BASE_URL: https://api.lilyprotocol.dev
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: Lint
            command: npm run lint
          - name: Format
            command: npm run format
          - name: Typecheck
            command: npm run typecheck
          - name: Test
            command: npm run test:run
          - name: Build
            command: npm run build
          - name: E2E
            command: npx playwright test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Restore Next.js cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.{ts,tsx}', 'next.config.ts', 'eslint.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        if: matrix.check.name == 'E2E'
        run: npx playwright install --with-deps chromium

      - name: Run ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}

      - name: Write workflow summary
        if: always()
        run: |
          {
            echo "## CI Check"
            echo ""
            echo "- Check: ${{ matrix.check.name }}"
            echo "- Command: \`${{ matrix.check.command }}\`"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always() && matrix.check.name == 'Test'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
